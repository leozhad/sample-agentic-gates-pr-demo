<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task labels — Taskboard</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      /* WCAG 1.4.11 applies to UI component boundaries, not to decorative
         separators, so these are deliberately two different colours:
         --control-border is ~4.1:1 on --bg and ~3.8:1 on --surface (a text
         input's border is the only thing locating the field), while --divider
         stays subtle because the table's row rules carry no information. */
      --control-border: #6e7681;
      --divider: #30363d;
      --text: #e6edf3;      /* 14.6:1 on --bg */
      --muted: #9aa7b8;     /* 7.4:1 on --bg — comfortably past AA */
      --accent: #58a6ff;    /* 6.4:1 on --bg */
    }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }
    main { max-width: 44rem; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
    .lede { color: var(--muted); margin: 0 0 1.5rem; }

    form { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 0.25rem; }
    label { font-size: 0.875rem; color: var(--muted); }
    input, button {
      font: inherit; border-radius: 6px; padding: 0.5rem 0.75rem;
      border: 1px solid var(--control-border);
    }
    input { background: var(--surface); color: var(--text); min-width: 14rem; }
    .hint { font-size: 0.8125rem; color: var(--muted); }
    button {
      background: var(--surface); color: var(--text); cursor: pointer;
      transition: background-color 120ms ease;
    }
    button:hover { background: #21262d; }
    /* Visible keyboard focus everywhere, never removed. */
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    /* Placed AFTER the transition it overrides so it wins the cascade. */
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }

    table { border-collapse: collapse; width: 100%; margin-top: 1.5rem; }
    caption { text-align: left; color: var(--muted); padding-bottom: 0.5rem; }
    th, td {
      text-align: left; padding: 0.5rem; border-bottom: 1px solid var(--divider);
    }
    .pill {
      display: inline-block; border: 1px solid var(--control-border);
      border-radius: 999px;
      padding: 0.125rem 0.625rem; font-size: 0.8125rem;
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0;
      margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Task labels</h1>
    <p class="lede">Group your tasks with short labels, then filter the board by one.</p>

    <form id="add-label-form">
      <div class="field">
        <label for="task-id">Task ID</label>
        <input id="task-id" name="taskId" type="number" min="1" inputmode="numeric" required>
      </div>
      <div class="field">
        <label for="label-name">Label</label>
        <input id="label-name" name="label" type="text" maxlength="32"
               pattern="[a-z0-9][a-z0-9\-]*" aria-describedby="label-hint" required>
        <span id="label-hint" class="hint">Lowercase letters, numbers and hyphens. Up to 32 characters.</span>
      </div>
      <button type="submit">Add label</button>
    </form>

    <!-- Announced to assistive tech without stealing focus. -->
    <p id="status" role="status" aria-live="polite" class="lede"></p>

    <table>
      <caption>Labels on your tasks</caption>
      <thead>
        <tr>
          <th scope="col">Task</th>
          <th scope="col">Title</th>
          <th scope="col">Labels</th>
          <th scope="col"><span class="sr-only">Actions</span></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>

  <script>
    const statusEl = document.getElementById("status");

    /** Report progress in text, never by colour alone. */
    function setStatus(message) {
      statusEl.textContent = message;
    }

    function renderRows(tasks) {
      const tbody = document.getElementById("rows");
      tbody.replaceChildren();
      for (const task of tasks) {
        const row = document.createElement("tr");

        const idCell = document.createElement("td");
        idCell.textContent = String(task.id);

        const titleCell = document.createElement("td");
        titleCell.textContent = task.title;

        const labelCell = document.createElement("td");
        for (const label of task.labels ?? []) {
          const pill = document.createElement("span");
          pill.className = "pill";
          pill.textContent = label;
          labelCell.append(pill, document.createTextNode(" "));
        }

        const actionCell = document.createElement("td");
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "Copy ID";
        // The accessible name states which task, since "Copy ID" alone is
        // ambiguous once the same label repeats down the column.
        button.setAttribute("aria-label", `Copy ID for task ${task.id}`);
        button.addEventListener("click", () => {
          navigator.clipboard.writeText(String(task.id))
            .then(() => setStatus(`Copied task ID ${task.id}.`))
            .catch(() => setStatus("Could not copy to the clipboard."));
        });
        actionCell.append(button);

        row.append(idCell, titleCell, labelCell, actionCell);
        tbody.append(row);
      }
    }

    async function load() {
      const response = await fetch("/tasks", { headers: { accept: "application/json" } });
      if (!response.ok) {
        setStatus("Could not load your tasks. Try again.");
        return;
      }
      renderRows(await response.json());
    }

    document.getElementById("add-label-form")
      .addEventListener("submit", async (event) => {
        event.preventDefault();
        const taskId = document.getElementById("task-id").value;
        const label = document.getElementById("label-name").value.trim().toLowerCase();
        setStatus(`Adding label ${label}…`);
        try {
          const response = await fetch(`/tasks/${encodeURIComponent(taskId)}/labels`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ label }),
          });
          if (!response.ok) {
            const problem = await response.json().catch(() => ({}));
            setStatus(`Could not add the label: ${problem.error ?? response.status}`);
            return;
          }
          setStatus(`Added label ${label} to task ${taskId}.`);
          await load();
        } catch (error) {
          setStatus("Could not reach the server. Check your connection.");
        }
      });

    load().catch(() => setStatus("Could not load your tasks. Try again."));
  </script>
</body>
</html>
